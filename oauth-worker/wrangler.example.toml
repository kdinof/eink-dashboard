name = "eink-calendar-oauth"
main = "src/index.ts"
compatibility_date = "2026-07-17"
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "OAUTH_HANDOFFS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Configure a custom domain/route before production deployment.
# route = { pattern = "eink-auth.example.com/*", zone_name = "example.com" }

# Secrets, set with `wrangler secret put`:
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# HANDOFF_ENCRYPTION_KEY  (base64url-encoded 32 random bytes)
# BROKER_SIGNING_KEY      (base64url-encoded 32 random bytes)
